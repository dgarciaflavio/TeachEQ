name: teacheq
description: "TeachEQ: copiloto de som para a mesa K-Audio HX-1202USB. Ensina equalização, simula a mesa e ajuda a resolver problemas durante o evento."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  record: ^7.2.0
  audioplayers: ^6.8.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
