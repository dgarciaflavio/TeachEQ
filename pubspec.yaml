name: teacheq
description: "TeachEQ: copiloto de som para a mesa K-Audio HX-1202USB. Ensina equalização, simula a mesa e ajuda a resolver problemas durante o evento."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  record: ^7.2.0
  audioplayers: ^6.8.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Ícone do app (gerado por tool/gerar_icone.py).
# Aplicar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#24262B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 23

# Tela de abertura nativa, na mesma cor da animação do app.
# Aplicar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1C1D21"
  android_12:
    color: "#1C1D21"
    image: assets/icon/splash.png
  android: true
  ios: false
  web: false
