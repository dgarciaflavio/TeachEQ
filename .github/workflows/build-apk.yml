name: Gerar APK

# Compila o TeachEQ a cada envio para a main (ou manualmente na aba Actions).
# O APK fica em "Artifacts" na página da execução.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Gerar pasta android/
        run: flutter create . --project-name teacheq --org br.com.teacheq --platforms android

      - name: Ajustar Android (permissões e minSdk)
        run: dart run tool/configurar_android.dart

      - name: Dependências
        run: flutter pub get

      - name: Análise do código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TeachEQ-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
